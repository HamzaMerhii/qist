{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QIST Management - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
  <div class="text-center mb-8">
    <div class="w-11 h-11 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg mx-auto mb-3">Q</div>
    <h1 class="text-xl font-bold text-slate-900">QIST Management</h1>
    <p class="text-sm text-slate-500 mt-1">Welcome back. Please enter your details.</p>
  </div>

  {% if messages %}
    <div class="space-y-2 mb-5">
      {% for message in messages %}
        <div class="rounded-lg bg-rose-50 text-rose-700 border border-rose-200 text-sm px-3 py-2">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <form class="space-y-5" method="post" action="{% url 'login' %}">
    {% csrf_token %}

    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-slate-700" for="id_username">Username</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">person</span>
        <input
          class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
          id="id_username" name="username" placeholder="your username" required type="text" autofocus>
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="block text-sm font-medium text-slate-700" for="id_password">Password</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">lock</span>
        <input
          class="w-full pl-9 pr-9 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
          id="id_password" name="password" placeholder="••••••••" required type="password">
        <button class="absolute right-0 inset-y-0 pr-3 flex items-center text-slate-400 hover:text-slate-600" onclick="togglePassword()" type="button">
          <span class="material-symbols-outlined text-[18px]" id="visibility-icon">visibility</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2 cursor-pointer">
        <input class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" id="remember-me" name="remember-me" type="checkbox">
        <span class="text-sm text-slate-600">Remember me</span>
      </label>
    </div>

    <button class="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors" type="submit">
      Sign In
    </button>
  </form>

  <div class="mt-6 border-t border-slate-100 pt-4 text-center">
    <p class="text-xs text-slate-400">Secure internal portal access.</p>
  </div>
</div>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('id_password');
    const visibilityIcon = document.getElementById('visibility-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      visibilityIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      visibilityIcon.textContent = 'visibility';
    }
  }
</script>
</body>
</html>
