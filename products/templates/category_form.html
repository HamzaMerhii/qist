<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Category</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background-color: #0056b3; }
        .btn-cancel { text-align: center; line-height: 38px; text-decoration: none; background-color: #6c757d; color: white; border-radius: 4px; flex: 1; font-size: 15px; }
        .btn-cancel:hover { background-color: #5a6268; }
        .error { color: #dc3545; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>{% if form.instance.pk %}Edit Category{% else %}Add New Category{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_name">Category Name</label>
            {{ form.name }}
            {% if form.name.errors %}
                <div class="error">{{ form.name.errors.0 }}</div>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="id_description">Description</label>
            {{ form.description }}
            {% if form.description.errors %}
                <div class="error">{{ form.description.errors.0 }}</div>
            {% endif %}
        </div>

        <div class="btn-group">
            <button type="submit">Save</button>
            <a href="{% url 'category_list' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
