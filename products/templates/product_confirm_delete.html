<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .warning-text { color: #dc3545; margin-bottom: 20px; font-size: 15px; }
        .product-info { background: #e9ecef; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: left; }
        .product-info strong { display: block; margin-bottom: 5px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { background-color: #c82333; }
        .btn-cancel { flex: 1; line-height: 38px; text-decoration: none; background-color: #6c757d; color: white; border-radius: 4px; font-size: 15px; }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>

<div class="card">
    <h2>Confirm Deletion</h2>
    
    <p class="warning-text">Are you sure you want to delete this product?</p>

    <div class="product-info">
        <strong>Name: {{ product.name }}</strong>
        <small>Category: {{ product.category.name|default:"Uncategorized" }}</small><br>
        <small>Stock Remaining: {{ product.stock_quantity }}</small>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="btn-group">
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'product_list' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
