<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Customer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 25px; border-radius: 6px; width: 100%; max-width: 400px; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { flex: 1; line-height: 38px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Delete Customer?</h3>
    <p>Are you sure you want to delete <strong>{{ customer.full_name }}</strong> ({{ customer.phone }})?</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="btn-group">
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'customers:customer_list' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
